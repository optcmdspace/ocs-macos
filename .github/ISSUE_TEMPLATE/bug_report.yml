name: Bug report
description: Something doesn't work the way it should.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Not sure if it's a bug? Ask in [Q&A](https://github.com/optcmdspace/ocs-macos/discussions/categories/q-a) first. That's the right place for "is this expected?" questions.
  - type: checkboxes
    id: preflight
    attributes:
      label: preflight
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: what happened?
      description: Describe the bug. What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: steps to reproduce
      placeholder: |
        1. Press ⌥⌘Space
        2. Type ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: where does it happen?
      multiple: true
      options:
        - capture panel (typing, submit)
        - list view (↓, navigation)
        - global hotkey
        - persistence (data on disk)
        - install or first launch
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ocs version
      description: From the DMG filename or the About window.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 15.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: logs or screenshots
      description: Optional. Console.app entries from the OCS process, or a screenshot of what you saw.
      render: shell
