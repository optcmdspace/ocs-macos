name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Ensure xcbeautify and swiftlint
        run: |
          command -v xcbeautify >/dev/null || brew install xcbeautify
          command -v swiftlint  >/dev/null || brew install swiftlint
          xcbeautify --version
          swiftlint --version

      - name: CQRS lint
        run: bash scripts/check-cqrs.sh

      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging

      - name: Restore SPM cache
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme OCS \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | xcbeautify --renderer github-actions --is-ci

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme OCS \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | xcbeautify --renderer github-actions --is-ci
