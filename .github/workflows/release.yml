name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0).'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-26
    environment: prod
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      SCHEME: OCS
      CONFIGURATION: Release
      APP_NAME: OptCmdSpace
      NOTARY_PROFILE: ocs-notary
      BUILD_DIR: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ocs-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING=()
          while IFS= read -r line; do
            [ -n "$line" ] && EXISTING+=("$line")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING[@]}"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          DEV_ID_CERT_P12_BASE64: ${{ secrets.DEV_ID_CERT_P12_BASE64 }}
          DEV_ID_CERT_PASSWORD: ${{ secrets.DEV_ID_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$DEV_ID_CERT_P12_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEV_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$CERT_PATH"

      - name: Set key partition list
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Resolve version and signing identity
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$TAG' must match v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "error: no Developer ID Application identity in keychain" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "identity=$IDENTITY"
            echo "archive_path=$BUILD_DIR/OCS.xcarchive"
            echo "export_dir=$BUILD_DIR/export"
            echo "app_path=$BUILD_DIR/export/$APP_NAME.app"
            echo "dmg_path=$BUILD_DIR/$APP_NAME-$VERSION.dmg"
            echo "stable_dmg_path=$BUILD_DIR/$APP_NAME.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p "$BUILD_DIR"
          cat > "$BUILD_DIR/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath "${{ steps.meta.outputs.archive_path }}" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION=${{ steps.meta.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath "${{ steps.meta.outputs.archive_path }}" \
            -exportOptionsPlist "$BUILD_DIR/exportOptions.plist" \
            -exportPath "${{ steps.meta.outputs.export_dir }}"

      - name: Notarize app
        run: |
          APP_ZIP="$BUILD_DIR/$APP_NAME.zip"
          ditto -c -k --keepParent "${{ steps.meta.outputs.app_path }}" "$APP_ZIP"
          xcrun notarytool submit "$APP_ZIP" \
            --keychain "$KEYCHAIN_PATH" \
            --keychain-profile "$NOTARY_PROFILE" \
            --wait
          rm "$APP_ZIP"

      - name: Staple app
        run: xcrun stapler staple "${{ steps.meta.outputs.app_path }}"

      - name: Build DMG
        run: |
          DMG_STAGING="$BUILD_DIR/dmg-staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          cp -R "${{ steps.meta.outputs.app_path }}" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "${{ steps.meta.outputs.dmg_path }}"
          rm -rf "$DMG_STAGING"

      - name: Sign DMG
        run: |
          codesign --sign "${{ steps.meta.outputs.identity }}" --timestamp \
            "${{ steps.meta.outputs.dmg_path }}"

      - name: Notarize DMG
        run: |
          xcrun notarytool submit "${{ steps.meta.outputs.dmg_path }}" \
            --keychain "$KEYCHAIN_PATH" \
            --keychain-profile "$NOTARY_PROFILE" \
            --wait

      - name: Staple DMG
        run: xcrun stapler staple "${{ steps.meta.outputs.dmg_path }}"

      - name: Copy stable-name DMG
        run: cp "${{ steps.meta.outputs.dmg_path }}" "${{ steps.meta.outputs.stable_dmg_path }}"

      - name: Verify signing and notarization
        run: |
          spctl --assess --verbose=4 --type execute "${{ steps.meta.outputs.app_path }}"
          spctl --assess --verbose=4 --type open --context context:primary-signature "${{ steps.meta.outputs.dmg_path }}"
          xcrun stapler validate "${{ steps.meta.outputs.app_path }}"
          xcrun stapler validate "${{ steps.meta.outputs.dmg_path }}"
          xcrun stapler validate "${{ steps.meta.outputs.stable_dmg_path }}"

      - name: Sign update and build appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          # Keep this in sync with the Sparkle version in Package.resolved.
          SPARKLE_VERSION: '2.9.4'
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ github.run_number }}
          DMG: ${{ steps.meta.outputs.dmg_path }}
        run: |
          set -euo pipefail

          # Fetch Sparkle's sign_update tool. Pinned to match the framework version.
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools
          SIGN=$(find sparkle-tools -type f -name sign_update | head -1)
          chmod +x "$SIGN"

          # Sign the exact stapled DMG bytes that get uploaded. Order matters:
          # this runs after stapling, since stapling rewrites the DMG.
          KEY_FILE="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          SIG_ATTRS=$("$SIGN" --ed-key-file "$KEY_FILE" "$DMG")
          rm -f "$KEY_FILE"

          DMG_NAME=$(basename "$DMG")
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DMG_NAME}"
          PUBDATE=$(date "+%a, %d %b %Y %H:%M:%S %z")

          APPCAST="$BUILD_DIR/appcast.xml"
          cat > "$APPCAST" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>OCS</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://optcmd.space/changelog</sparkle:releaseNotesLink>
                <enclosure url="${DMG_URL}" ${SIG_ATTRS} type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          echo "APPCAST_PATH=$APPCAST" >> "$GITHUB_ENV"
          echo "Generated appcast:"
          cat "$APPCAST"

      - name: Summarize release
        id: summary
        run: |
          DMG="${{ steps.meta.outputs.dmg_path }}"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          NAME=$(basename "$DMG")
          STABLE_NAME=$(basename "${{ steps.meta.outputs.stable_dmg_path }}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Release ${{ steps.meta.outputs.version }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Marketing version | ${{ steps.meta.outputs.version }} |"
            echo "| Build number | ${{ github.run_number }} |"
            echo "| DMG | \`$NAME\` |"
            echo "| Stable alias | \`$STABLE_NAME\` |"
            echo "| Size | $(du -h "$DMG" | awk '{print $1}') |"
            echo "| SHA-256 | \`$SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocs-dmg-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          NOTES_FILE="$BUILD_DIR/release-notes.md"
          awk -v v="${{ steps.meta.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## \[/        { exit }
            flag && /^\[[^]]+\]:/   { exit }
            flag                    { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DMG: ${{ steps.meta.outputs.dmg_path }}
          STABLE_DMG: ${{ steps.meta.outputs.stable_dmg_path }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          if [ "$NOTES_FOUND" = "true" ]; then
            gh release create "$TAG" "$DMG" "$STABLE_DMG" "$APPCAST_PATH" \
              --title "$TAG" \
              --notes-file "$NOTES_PATH" \
              --verify-tag
          else
            gh release create "$TAG" "$DMG" "$STABLE_DMG" "$APPCAST_PATH" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Bump cask in tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.summary.outputs.sha }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/optcmdspace/homebrew-ocs.git" tap
          cd tap
          sed -i '' "s|version \".*\"|version \"$VERSION\"|" Casks/optcmdspace.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"$SHA\"|" Casks/optcmdspace.rb
          if git diff --quiet; then
            echo "cask already at $VERSION; skipping"
            exit 0
          fi
          git -c user.name="Rodrigo Costa" \
              -c user.email="rodrigo@optcmd.space" \
              commit -am "chore: bump cask to $VERSION"
          git push origin main

      - name: Announce release in Discussions
        id: announce
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          REPO: ${{ github.repository }}
          REPO_ID: R_kgDOSYOcLA
          CATEGORY_ID: DIC_kwDOSYOcLM4C8ufP
        run: |
          if [ "$NOTES_FOUND" = "true" ]; then
            NOTES=$(cat "$NOTES_PATH")
          else
            NOTES="See the [release page](https://github.com/$REPO/releases/tag/$TAG) for details."
          fi
          BODY=$(printf '%s\n\n---\n\n[download](https://github.com/%s/releases/tag/%s) · [changelog](https://optcmd.space/changelog)\n\nsaw something weird? reply here. built a workflow worth sharing? post it in [show-and-tell](https://github.com/%s/discussions/categories/show-and-tell).\n' \
            "$NOTES" "$REPO" "$TAG" "$REPO")
          # shellcheck disable=SC2016  # $r/$c/$t/$b are GraphQL variables, not shell expansions
          gh api graphql \
            -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$REPO_ID" \
            -f c="$CATEGORY_ID" \
            -f t="release $TAG" \
            -f b="$BODY"

      - name: Flag missing release announcement
        if: steps.announce.outcome == 'failure'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "::warning::Release announcement failed for ${TAG}. The release itself shipped; the Discussions thread was not created. See the previous step's logs."

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
